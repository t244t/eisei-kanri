<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>衛生管理記録</title>
<style>
:root{--g:#3b7d3a;--g2:#e8f0e0;--line:#d6dccf;--ng:#d00000;--bg:#f6f7f3;--tx:#222}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:10px 12px 0}
header h1{margin:0 0 8px;font-size:18px}
.sel{display:flex;gap:8px}
.sel select{flex:1;font-size:15px;padding:8px;border-radius:8px;border:0}
nav{display:flex;margin-top:10px}
nav button{flex:1;background:none;border:0;color:#d9ead6;padding:10px 0;font-size:15px;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#fff;font-weight:bold}
main{max-width:900px;margin:0 auto;padding:12px 12px 80px}
section{display:none}section.on{display:block}
h2{font-size:16px;margin:18px 0 8px;padding-left:8px;border-left:4px solid var(--g);display:flex;align-items:center;gap:8px}
h3{font-size:14px;margin:12px 0 6px;color:#555}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=month],input[type=text],textarea,select{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{width:100%;min-height:80px}
button{font-size:15px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.primary{background:var(--g);color:#fff;border:0;width:100%;padding:14px;font-size:17px;margin-top:16px}
button.mini{font-size:13px;padding:4px 10px;margin-left:auto}
.status{margin:10px 0;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:14px}
.status.done{background:#eef7ea;border-color:#b9d8ad}
.item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.item .lbl{flex:1;font-size:15px}
.item small{display:block;color:#777;font-size:12px;margin-top:2px}
.item.na{opacity:.55}
.seg{display:flex}
.seg button{width:44px;height:40px;padding:0;font-size:18px;border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on[data-v="○"]{background:var(--g);color:#fff}
.seg button.on[data-v="×"]{background:var(--ng);color:#fff}
.seg button.on[data-v="－"]{background:#888;color:#fff}
.temp input{width:84px;font-size:18px;text-align:right;padding:6px}
.temp.warn{border-color:var(--ng);background:#fff3f3}
.temp .w{color:var(--ng);font-size:12px;font-weight:bold}
.closedMsg{display:none;padding:20px;text-align:center;color:#666;background:#fff;border-radius:10px}
.closed .closedMsg{display:block}.closed #recBody{display:none}
.chief{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.chief h2{margin-top:0}
/* 月次表 */
.mwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:10px}
table.month{border-collapse:collapse;font-size:11px;min-width:100%}
.month th,.month td{border:1px solid #bbb;padding:2px;text-align:center;min-width:22px;height:22px}
.month td.lbl{text-align:left;white-space:nowrap;padding:2px 6px;position:sticky;left:0;background:#fff}
.month td.grp{writing-mode:vertical-rl;background:var(--g2);font-weight:bold;letter-spacing:2px}
.month th{background:var(--g2)}.month th.sat{color:#1a5fb4}.month th.sun{color:var(--ng)}
.month td.ng{color:var(--ng);font-weight:bold;background:#fff0f0}
.month td.cl{color:#999;background:#f2f2f2}
.month tr.name td:not(.lbl){font-size:9px;writing-mode:vertical-rl;height:52px}
.mtitle{font-size:16px;font-weight:bold;margin:12px 0 4px}
.notes{margin-top:10px;font-size:13px}
.notes div{border-bottom:1px dashed var(--line);padding:4px 0}
/* 計画書 */
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.pcard h4{margin:0 0 6px;font-size:15px;color:var(--g)}
.pg{margin:6px 0}.pg .gl{font-size:13px;font-weight:bold;color:#555;margin-bottom:4px}
.pg label{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;font-size:14px}
.pg input[type=checkbox]{width:18px;height:18px}
.pg input.other{width:100%;margin-top:4px;font-size:14px;padding:6px}
.phead{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:8;font-size:15px}
#loading.show{display:flex}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;font-size:11px}
  header,.noprint,button{display:none!important}
  main{max-width:none;padding:0}
  .mwrap{overflow:visible;border:0}
  table.month{font-size:9px}.month td.lbl{position:static}
  #tab-plan .pcards{columns:2;column-gap:12px}
  .pcard{break-inside:avoid;padding:6px;margin-bottom:6px}
  .pg label{font-size:11px}.pg input.other{border:0;border-bottom:1px solid #999;border-radius:0;padding:2px}
}
</style>
</head>
<body>
<header>
  <h1>衛生管理記録</h1>
  <div class="sel"><select id="store"></select><select id="recorder"></select></div>
  <nav>
    <button data-tab="rec" class="on">毎日の記録</button>
    <button data-tab="month">月次記録表</button>
    <button data-tab="plan">計画書</button>
  </nav>
</header>

<main>
<!-- 毎日の記録 -->
<section id="tab-rec" class="on">
  <div class="row">
    <input type="date" id="date">
    <label><input type="checkbox" id="closed"> 休業日</label>
  </div>
  <div id="recStatus" class="status">読み込み中…</div>
  <div id="recArea">
    <div class="closedMsg">休業日として記録します</div>
    <div id="recBody">
      <h2>一般衛生管理 <button class="mini" id="allOk">すべて○</button></h2>
      <div id="genItems"></div>
      <h2>重要管理</h2>
      <div id="impItems"></div>
      <h2>特記事項</h2>
      <textarea id="note" placeholder="×や温度異常のときは、理由と対応内容を記入してください"></textarea>
    </div>
  </div>
  <button class="primary" id="saveRec">保存する</button>
  <div class="chief">
    <h2>責任者確認</h2>
    <div id="chiefStatus" style="margin-bottom:8px;font-size:14px">未確認</div>
    <div class="row"><select id="chiefName"></select><button id="confirmBtn">確認する</button></div>
  </div>
</section>

<!-- 月次記録表 -->
<section id="tab-month">
  <div class="row noprint">
    <input type="month" id="ym">
    <button id="loadMonth">表示</button>
    <button id="printMonth">印刷</button>
    <button id="pdfMonth">ドライブにPDF保存</button>
  </div>
  <div id="monthView"></div>
</section>

<!-- 計画書 -->
<section id="tab-plan">
  <p class="noprint" style="font-size:13px;color:#666;margin-top:0">お店で実施する内容にチェックし、記載と違う方法は「その他」に書きます。店舗ごとに保存されます。</p>
  <div class="phead">
    <span>屋号</span><input type="text" id="pYago">
    <span>作成者</span><input type="text" id="pAuthor">
    <span>作成日</span><input type="date" id="pDate">
  </div>
  <h2>一般衛生管理のポイント</h2>
  <div class="pcards" id="planGeneral"></div>
  <h2>重要管理のポイント</h2>
  <div class="pcards" id="planImportant"></div>
  <div class="row noprint" style="margin-top:12px">
    <button class="primary" id="savePlan" style="flex:2">計画を保存</button>
    <button id="printPlan" style="flex:1;margin-top:16px;padding:14px">印刷</button>
  </div>
</section>
</main>

<div id="toast"></div>
<div id="loading">通信中…</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkMJJ4l5j1ka4TudSAaPbbyAFnUlfdUdyOleRzVwsIZaI_KsZPamE-Xa5RbuV9sd8mJA/exec';

const $ = id => document.getElementById(id);
let INIT = null, PLAN = null, REC = { items: {}, temps: {} };

/* ---------- 通信（GETのみ） ---------- */
async function api(action, params = {}, quiet = false) {
  const q = new URLSearchParams({ action, ...params, _: Date.now() });
  if (!quiet) $('loading').classList.add('show');
  try {
    const res = await fetch(`${GAS_URL}?${q}`);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    return j.data;
  } finally { $('loading').classList.remove('show'); }
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = () => $('store').value;
const units = () => INIT.units.filter(u => u.store === store());
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

/* ---------- 起動 ---------- */
async function boot() {
  $('date').value = today();
  $('ym').value = today().slice(0, 7);
  try { INIT = await api('init'); } catch (e) { $('recStatus').textContent = '接続できません：' + e.message; return; }
  $('store').innerHTML = INIT.stores.map(s => `<option>${esc(s.name)}</option>`).join('');
  const ls = load('hy_store'); if (ls && INIT.stores.some(s => s.name === ls)) $('store').value = ls;
  await onStoreChange();
}
async function onStoreChange() {
  save('hy_store', store());
  const staff = INIT.staff.filter(s => !s.store || s.store === store());
  $('recorder').innerHTML = '<option value="">記録者を選択</option>' + staff.map(s => `<option>${esc(s.name)}</option>`).join('');
  const lr = load('hy_rec'); if (lr && staff.some(s => s.name === lr)) $('recorder').value = lr;
  $('chiefName').innerHTML = staff.filter(s => s.chief).map(s => `<option>${esc(s.name)}</option>`).join('') || '<option value="">（責任者未登録）</option>';
  PLAN = await api('getPlan', { store: store() }, true);
  renderPlan();
  await loadRecord();
  if ($('tab-month').classList.contains('on')) loadMonth();
}

/* ---------- 計画からのヒント ---------- */
const planSec = key => INIT.planDef.find(p => p.key === key);
function checkedOpts(key, gi) {
  const sec = planSec(key); if (!sec || !PLAN) return [];
  const g = sec.groups[gi]; if (!g) return [];
  const list = g.opts.filter((o, oi) => PLAN.c && PLAN.c[`${key}_${gi}_${oi}`]);
  const other = PLAN.o && PLAN.o[`${key}_${gi}_other`];
  if (other) list.push(other);
  return list;
}
function hintOf(item) {
  if (item.group === '一般') return checkedOpts(item.key, 1).join('／');
  return checkedOpts(item.key, 0).join('・');
}
function applicable(item) {
  if (item.group === '一般' || !PLAN) return true;
  return checkedOpts(item.key, 0).length > 0;
}

/* ---------- 毎日の記録 ---------- */
function itemHtml(it) {
  const h = hintOf(it);
  const na = !applicable(it);
  return `<div class="item${na ? ' na' : ''}" data-key="${it.key}">
    <div class="lbl">${esc(it.label)}${h ? `<small>${esc(h)}</small>` : ''}${na ? '<small>計画書でメニュー未設定（該当なし）</small>' : ''}</div>
    <div class="seg">${['○', '×', '－'].map(v => `<button data-v="${v}">${v}</button>`).join('')}</div></div>`;
}
function tempHtml(u) {
  const neg = u.type === '冷凍庫';
  return `<div class="item temp" data-unit="${esc(u.name)}">
    <div class="lbl">${esc(u.name)}<small>${u.limit}℃以下</small><span class="w"></span></div>
    ${neg ? '<button class="sign" title="符号切替">±</button>' : ''}
    <input type="number" step="0.1" placeholder="${neg ? '-20' : '5'}"> ℃</div>`;
}
function renderRecordForm() {
  const gen = INIT.items.filter(i => i.group === '一般');
  $('genItems').innerHTML = itemHtml(gen[0]) + '<h3>庫内温度の確認</h3>' + units().map(tempHtml).join('') +
    '<h3>その他の点検</h3>' + gen.slice(1).map(itemHtml).join('');
  $('impItems').innerHTML = INIT.items.filter(i => i.group === '重要').map(itemHtml).join('');
}
function paintRecord() {
  document.querySelectorAll('#recBody .item[data-key]').forEach(el => {
    const v = REC.items[el.dataset.key] || '';
    el.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  });
  document.querySelectorAll('#recBody .temp').forEach(el => {
    const u = units().find(x => x.name === el.dataset.unit);
    const t = REC.temps[u.name];
    el.querySelector('input').value = t ?? '';
    const ng = t !== '' && t != null && Number(t) > u.limit;
    el.classList.toggle('warn', ng);
    el.querySelector('.w').textContent = ng ? ' 基準超え' : '';
  });
  $('note').value = REC.note || '';
  $('closed').checked = !!REC.closed;
  $('recArea').classList.toggle('closed', !!REC.closed);
}
async function loadRecord() {
  renderRecordForm();
  $('recStatus').textContent = '読み込み中…'; $('recStatus').className = 'status';
  const r = await api('getRecord', { store: store(), date: $('date').value }, true);
  if (r) {
    REC = { items: r.items, temps: r.temps, note: r.note, closed: r.closed };
    $('recStatus').textContent = `保存済み（記録者：${r.recorder}／${r.updated}）`;
    $('recStatus').className = 'status done';
    $('chiefStatus').textContent = r.confirm ? `確認済み：${r.confirm}（${r.confirmAt}）` : '未確認';
  } else {
    REC = { items: {}, temps: {}, note: '', closed: false };
    INIT.items.forEach(it => { if (!applicable(it)) REC.items[it.key] = '－'; });
    $('recStatus').textContent = 'この日はまだ記録されていません';
    $('chiefStatus').textContent = '未確認';
  }
  paintRecord();
}
document.addEventListener('click', e => {
  const b = e.target.closest('.seg button');
  if (b) { REC.items[b.closest('.item').dataset.key] = b.dataset.v; paintRecord(); return; }
  const s = e.target.closest('button.sign');
  if (s) {
    const inp = s.parentElement.querySelector('input');
    if (inp.value !== '') { inp.value = String(-Number(inp.value)); inp.dispatchEvent(new Event('input', { bubbles: true })); }
  }
});
document.addEventListener('input', e => {
  const el = e.target.closest('.temp'); if (!el) return;
  REC.temps[el.dataset.unit] = e.target.value;
  const u = units().find(x => x.name === el.dataset.unit);
  const ng = e.target.value !== '' && Number(e.target.value) > u.limit;
  el.classList.toggle('warn', ng); el.querySelector('.w').textContent = ng ? ' 基準超え' : '';
});
$('allOk').onclick = () => { INIT.items.filter(i => i.group === '一般').forEach(it => { if (!REC.items[it.key]) REC.items[it.key] = '○'; }); paintRecord(); };
$('closed').onchange = () => { REC.closed = $('closed').checked; $('recArea').classList.toggle('closed', REC.closed); };
$('note').oninput = () => REC.note = $('note').value;

$('saveRec').onclick = async () => {
  const recorder = $('recorder').value;
  if (!recorder) return alert('記録者を選んでください');
  if (!REC.closed) {
    const empty = INIT.items.filter(it => !REC.items[it.key]);
    if (empty.length) return alert('未入力の項目があります：\n' + empty.map(i => '・' + i.label).join('\n'));
    const noTemp = units().filter(u => REC.temps[u.name] === '' || REC.temps[u.name] == null);
    if (noTemp.length && !confirm(`温度が未入力の機器が${noTemp.length}台あります。このまま保存しますか？`)) return;
    const hasNg = INIT.items.some(it => REC.items[it.key] === '×') ||
      units().some(u => REC.temps[u.name] !== '' && REC.temps[u.name] != null && Number(REC.temps[u.name]) > u.limit);
    if (hasNg && !(REC.note || '').trim()) { $('note').focus(); return alert('×または温度異常があります。特記事項に理由と対応内容を記入してください'); }
  }
  save('hy_rec', recorder);
  try {
    const temps = {}; units().forEach(u => { if (REC.temps[u.name] !== undefined) temps[u.name] = REC.temps[u.name]; });
    const data = { recorder, closed: !!REC.closed, items: REC.closed ? {} : REC.items, temps: REC.closed ? {} : temps, note: REC.note || '' };
    await api('saveRecord', { store: store(), date: $('date').value, data: JSON.stringify(data) });
    toast('保存しました');
    loadRecord();
  } catch (e) { alert('保存できませんでした：' + e.message); }
};
$('confirmBtn').onclick = async () => {
  const name = $('chiefName').value; if (!name) return alert('記録者シートで責任者に○を付けてください');
  try {
    const r = await api('confirm', { store: store(), date: $('date').value, name });
    $('chiefStatus').textContent = `確認済み：${r.confirm}（${r.confirmAt}）`; toast('確認しました');
  } catch (e) { alert(e.message); }
};

/* ---------- 月次記録表 ---------- */
async function loadMonth() {
  try {
    const M = await api('getMonth', { store: store(), ym: $('ym').value });
    const [y, m] = M.ym.split('-').map(Number);
    let h = `<div class="mtitle">${esc(M.title)}　${esc(M.yago)}</div>
      <div style="font-size:12px;color:#666">記録は1年間保存しましょう。　記録日数：${M.recorded}／${M.days}日</div>
      <div class="mwrap"><table class="month"><thead><tr><th colspan="2">点検項目</th>`;
    for (let d = 1; d <= M.days; d++) {
      const w = new Date(y, m - 1, d).getDay();
      h += `<th class="${w === 6 ? 'sat' : w === 0 ? 'sun' : ''}">${d}</th>`;
    }
    h += '</tr></thead><tbody>';
    M.rows.forEach((r, i) => {
      h += `<tr class="${r.cls}">`;
      if (i === 0 || M.rows[i - 1].group !== r.group) {
        const span = M.rows.filter(x => x.group === r.group).length;
        h += r.group ? `<td class="grp" rowspan="${span}">${esc(r.group)}</td><td class="lbl">${esc(r.label)}</td>`
                     : `<td class="lbl" colspan="2">${esc(r.label)}</td>`;
      } else {
        h += r.group ? `<td class="lbl">${esc(r.label)}</td>` : `<td class="lbl" colspan="2">${esc(r.label)}</td>`;
      }
      h += r.cells.map(c => `<td class="${c.ng ? 'ng' : c.v === '休' ? 'cl' : ''}">${esc(c.v)}</td>`).join('') + '</tr>';
    });
    h += '</tbody></table></div><div class="notes"><b>＊特記事項＊</b>';
    h += M.notes.length ? M.notes.map(n => `<div>${n.day}日　${esc(n.text)}</div>`).join('') : '<div>なし</div>';
    $('monthView').innerHTML = h + '</div>';
  } catch (e) { $('monthView').textContent = '読み込めませんでした：' + e.message; }
}
$('loadMonth').onclick = loadMonth;
$('printMonth').onclick = () => window.print();
$('pdfMonth').onclick = async () => {
  try {
    const r = await api('savePdf', { store: store(), ym: $('ym').value });
    toast('PDFを保存しました');
    if (confirm(`ドライブに保存しました：\n${r.name}\n\n開きますか？`)) window.open(r.url, '_blank');
  } catch (e) { alert('PDF保存に失敗しました：' + e.message); }
};

/* ---------- 計画書 ---------- */
function renderPlan() {
  const st = INIT.stores.find(s => s.name === store());
  const P = PLAN || { header: {}, c: {}, o: {} };
  $('pYago').value = (P.header && P.header.yago) || (st && st.yago) || '';
  $('pAuthor').value = (P.header && P.header.author) || '';
  $('pDate').value = (P.header && P.header.date) || '';
  const card = sec => `<div class="pcard"><h4>${sec.no ? sec.no + '　' : ''}${esc(sec.title)}</h4>` +
    sec.groups.map((g, gi) => `<div class="pg"><div class="gl">${esc(g.label)}</div>` +
      g.opts.map((o, oi) => { const id = `${sec.key}_${gi}_${oi}`; return `<label><input type="checkbox" data-id="${id}"${P.c && P.c[id] ? ' checked' : ''}>${esc(o)}</label>`; }).join('') +
      `<input type="text" class="other" data-oid="${sec.key}_${gi}_other" placeholder="${g.menu ? 'その他のメニュー' : 'その他'}" value="${esc((P.o && P.o[`${sec.key}_${gi}_other`]) || '')}"></div>`).join('') + '</div>';
  $('planGeneral').innerHTML = INIT.planDef.filter(s => s.cat === 'general').map(card).join('');
  $('planImportant').innerHTML = INIT.planDef.filter(s => s.cat === 'important').map(card).join('');
}
$('savePlan').onclick = async () => {
  const plan = { header: { yago: $('pYago').value, author: $('pAuthor').value, date: $('pDate').value }, c: {}, o: {} };
  document.querySelectorAll('#tab-plan input[data-id]').forEach(i => { if (i.checked) plan.c[i.dataset.id] = 1; });
  document.querySelectorAll('#tab-plan input[data-oid]').forEach(i => { if (i.value.trim()) plan.o[i.dataset.oid] = i.value.trim(); });
  try {
    await api('savePlan', { store: store(), data: JSON.stringify(plan) });
    PLAN = plan; toast('計画を保存しました'); loadRecord();
  } catch (e) { alert('保存できませんでした：' + e.message); }
};
$('printPlan').onclick = () => window.print();

/* ---------- 画面切替 ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === 'tab-' + b.dataset.tab));
  if (b.dataset.tab === 'month') loadMonth();
});
$('store').onchange = onStoreChange;
$('recorder').onchange = () => save('hy_rec', $('recorder').value);
$('date').onchange = loadRecord;

boot();
</script>
</body>
</html>
